 kind: "AppHostingYaml"
schemaVersion: "v1"

runConfig:
  cpu: 2
  memoryMiB: 2048
  minInstances: 0
  maxInstances: 10
  concurrency: 80

environmentVariables:
  - variable: NEXT_TELEMETRY_DISABLED
    value: "1"
  - variable: NODE_ENV
    value: "production"
  
  # 💎 THE AI LINK: Mapping the Secret Manager Vault to the App
  - variable: GOOGLE_API_KEY
    secret: "GOOGLE_GENERATIVE_AI_API_KEY"