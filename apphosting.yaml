kind: "AppHostingConfig"
schemaVersion: "v1"

# 🛰️ RUNTIME TOPOLOGY
runConfig:
  cpu: 2
  memoryMiB: 2048
  minInstances: 0
  maxInstances: 10
  concurrency: 80

# 🛡️ ENVIRONMENT & SECRET MAPPING
environmentVariables:
  - variable: NEXT_TELEMETRY_DISABLED
    value: "1"
    availability: [BUILD, RUNTIME]
  - variable: NODE_ENV
    value: "production"
    availability: [BUILD, RUNTIME]
  
  # 🛰️ FIREBASE PUBLIC CONFIG
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "studio-2840117705-12faa"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyAf2QHay947IJzBTr5C5_gJNqShCv9FcPE"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "studio-2840117705-12faa.firebaseapp.com"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "studio-2840117705-12faa.firebasestorage.app"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "342003687950"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:342003687950:web:fd1a0fc72ace91cf1c125f"
    availability: [BUILD, RUNTIME]

  # 💎 THE AI LINK
  - variable: GOOGLE_API_KEY
    secret: GOOGLE_API_KEY
    availability: [BUILD, RUNTIME]
  
  # 🛰️ LIVE TRANSMISSION
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability: [BUILD, RUNTIME]