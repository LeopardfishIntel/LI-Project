name: Integrity & Crawler CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Test, Audit & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit & Snapshot Tests
        run: npm run test

      - name: Audit Canonical FLIS IDs
        run: npm run audit:ids

      - name: Typecheck TypeScript
        run: npm run typecheck
